name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true

  # Les 18 specs Playwright existaient depuis des mois sans jamais tourner en
  # intégration : 8 d'entre elles échouaient silencieusement. Ce job ferme
  # cette brèche. Il tourne sans Supabase (`--mode test` charge .env.test, qui
  # vide volontairement les variables) : aucun secret n'est requis.
  e2e:
    name: E2E (Playwright · chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Installer chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  orchestrator:
    name: Orchestrateur (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  hygiene:
    name: Hygiène dépôt (secrets · artefacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun .env (hors .example/.test) versionné
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$|\.env\.test$'; then
            echo "::error::Un fichier .env est versionné"; exit 1; fi
      - name: Aucun node_modules / dist versionné
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|dist)/'; then
            echo "::error::Artefacts de build versionnés"; exit 1; fi
      - name: Aucune valeur secrète évidente
        run: |
          if git ls-files | grep -vE 'package-lock|\.env\.example' \
            | xargs grep -lEi 'eyJ[A-Za-z0-9_-]{30,}|postgres(ql)?://[a-z0-9_]+:[^@ ]+@|hooks\.slack\.com/services/T[A-Z0-9]+/B' 2>/dev/null; then
            echo "::error::Valeur secrète potentielle détectée"; exit 1; fi
